<div class="auth-card">
  <h1>{{ isRegistering ? 'Register' : 'Login' }}</h1>

  <form *ngIf="!isRegistering" [formGroup]="loginForm" (ngSubmit)="submitLogin()">
    <label>Email</label>
    <input type="email" formControlName="email" />
    <div class="error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
      <div *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</div>
      <div *ngIf="loginForm.get('email')?.errors?.['email']">Enter a valid email.</div>
    </div>

    <label>Password</label>
    <input type="password" formControlName="password" />
    <div class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
      <div *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</div>
      <div *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 8 characters.</div>
    </div>

    <button type="submit" [disabled]="loading">Login</button>
  </form>

  <form *ngIf="isRegistering" [formGroup]="registerForm" (ngSubmit)="submitRegister()">
    <label>Name</label>
    <input type="text" formControlName="name" />
    <div class="error" *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid">
      <div *ngIf="registerForm.get('name')?.errors?.['required']">Name is required.</div>
    </div>

    <label>Email</label>
    <input type="email" formControlName="email" />
    <div class="error" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
      <div *ngIf="registerForm.get('email')?.errors?.['required']">Email is required.</div>
      <div *ngIf="registerForm.get('email')?.errors?.['email']">Enter a valid email.</div>
    </div>

    <label>Password</label>
    <input type="password" formControlName="password" />
    <div class="error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
      <div *ngIf="registerForm.get('password')?.errors?.['required']">Password is required.</div>
      <div *ngIf="registerForm.get('password')?.errors?.['minlength']">Password must be at least 8 characters.</div>
    </div>

    <button type="submit" [disabled]="loading">Register</button>
  </form>

  <div class="message" *ngIf="errorMessage">{{ errorMessage }}</div>
  <button type="button" (click)="toggleRegister()">
    {{ isRegistering ? 'Back to login' : 'Create an account' }}
  </button>
</div>
